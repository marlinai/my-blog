name: 自动更新文章列表

on:
  push:
    paths:
      - 'posts/**.md'     # 只在 posts 目录的 .md 文件变化时触发
  workflow_dispatch:       # 允许手动触发

jobs:
  update-config:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 允许推送回仓库
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 扫描文章并生成 config.js
        run: python3 generate_list.py --owner "${{ github.repository_owner }}" --repo "${{ github.event.repository.name }}" --branch "main"

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.js
          if git diff --cached --quiet; then
            echo "config.js 无变化，跳过提交"
          else
            git commit -m "🤖 自动更新 config.js [skip ci]"
            git push
          fi
