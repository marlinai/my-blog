<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加载中...</title>
    <!-- 引入 Tailwind CSS 用于快速美化样式 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 Marked.js 用于在浏览器端解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入我们的文章配置文件 -->
    <script src="./config.js"></script>
    <style>
        .prose h1 { font-size: 2rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 1rem; color: #111827; line-height: 1.3; }
        .prose h2 { font-size: 1.5rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #1f2937; padding-bottom: 0.4rem; border-bottom: 1px solid #e5e7eb; }
        .prose h3 { font-size: 1.25rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.5rem; color: #374151; }
        .prose h4, .prose h5, .prose h6 { font-size: 1.1rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #4b5563; }
        .prose p { margin-bottom: 1rem; line-height: 1.8; color: #374151; }
        .prose a { color: #2563eb; text-decoration: underline; text-underline-offset: 2px; }
        .prose a:hover { color: #1d4ed8; }
        .prose strong { font-weight: 600; color: #111827; }
        .prose em { font-style: italic; }
        .prose del { text-decoration: line-through; color: #9ca3af; }
        .prose ul, .prose ol { margin-bottom: 1rem; padding-left: 1.5rem; }
        .prose ul { list-style-type: disc; }
        .prose ol { list-style-type: decimal; }
        .prose li { margin-bottom: 0.5rem; line-height: 1.8; color: #374151; }
        .prose li > ul, .prose li > ol { margin-top: 0.25rem; margin-bottom: 0.25rem; }
        .prose blockquote { border-left: 3px solid #6366f1; padding: 0.5rem 1rem; margin-bottom: 1rem; background: #f8fafc; color: #475569; font-style: italic; border-radius: 0 0.25rem 0.25rem 0; }
        .prose blockquote p { margin-bottom: 0; color: inherit; }
        .prose code { font-family: 'SF Mono', 'Fira Code', 'Fira Mono', Menlo, Consolas, monospace; font-size: 0.875em; background: #f1f5f9; color: #be123c; padding: 0.15em 0.4em; border-radius: 0.25rem; font-weight: 500; }
        .prose pre { background: #1e293b; color: #e2e8f0; padding: 1.25rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1.5rem; line-height: 1.6; }
        .prose pre code { background: none; color: inherit; padding: 0; font-size: 0.875rem; font-weight: 400; }
        .prose hr { border: none; border-top: 1px solid #e5e7eb; margin: 2rem 0; }
        .prose img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 1rem 0; }
        .prose table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        .prose th, .prose td { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; text-align: left; }
        .prose th { background: #f8fafc; font-weight: 600; }
        @media (max-width: 640px) {
            .prose h1 { font-size: 1.5rem; }
            .prose h2 { font-size: 1.25rem; }
            .prose pre { padding: 0.75rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 导航栏 -->
    <header class="bg-white shadow-xs border-b border-gray-200">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" id="blog-title" class="text-xl font-bold text-gray-900 hover:text-blue-600 transition">我的博客</a>
            <a href="add.html" class="text-sm font-medium text-gray-500 hover:text-gray-900">发布文章</a>
            <a href="index.html" class="text-sm font-medium text-gray-500 hover:text-gray-900">首页</a>
        </div>
    </header>

    <!-- 主体内容区域 -->
    <main class="flex-grow max-w-3xl w-full mx-auto px-4 py-8">
        <!-- Markdown 内容或文章列表会动态渲染到这个 div 里 -->
        <div id="content" class="prose max-w-none">
            <p class="text-gray-500">正在加载内容...</p>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-gray-100 border-t border-gray-200 py-6 text-center text-sm text-gray-500">
        Powered by GitHub Pages & Marked.js
    </footer>

    <!-- 核心路由与渲染脚本 -->
    <script>
        // 设置网页标题
        document.title = BLOG_CONFIG.title;
        document.getElementById('blog-title').innerText = BLOG_CONFIG.title;

        // 全局分页与排序状态
        let allArticles = [];
        let currentPage = 1;
        let pageSize = 20;
        let currentSortOrder = 'date-desc'; // 默认：时间最新在上面

        // 1. 获取 URL 参数 (例如: index.html?post=hello-world.md)
        const urlParams = new URLSearchParams(window.location.search);
        const currentPost = urlParams.get('post');
        const contentDiv = document.getElementById('content');

        // 2. 路由判断
        if (currentPost) {
            // 【详情页】：同时 fetch md 文件和获取最后 commit 时间
            Promise.all([
                fetch(`./posts/${currentPost}`).then(res => {
                    if (!res.ok) throw new Error('文章未找到');
                    return res.text();
                }),
                fetch(`https://api.github.com/repos/${BLOG_CONFIG.owner}/${BLOG_CONFIG.repo}/commits?path=posts/${encodeURIComponent(currentPost)}&per_page=1`)
                    .then(res => {
                        if (!res.ok) throw new Error('API 被限流或失败');
                        return res.json();
                    })
                    .catch(() => {
                        // API 失败或限流时，从本地 config.js 寻找对应的文章作为兜底获取时间
                        console.warn('详情页 GitHub API 请求失败或限流，正在尝试读取本地 config.js 兜底时间...');
                        const localArticle = BLOG_CONFIG.articles ? BLOG_CONFIG.articles.find(a => a.file === currentPost) : null;
                        return localArticle && localArticle.date ? [{ commit: { committer: { date: localArticle.date } } }] : null;
                    })
            ])
            .then(([markdownText, commits]) => {
                // 提取最后推送时间
                let dateStr = '';
                if (commits && commits.length > 0) {
                    const rawDate = commits[0].commit.committer.date;
                    if (rawDate) {
                        const d = new Date(rawDate);
                        // 判断是否是有效的日期对象
                        if (!isNaN(d.getTime())) {
                            const pad = n => String(n).padStart(2, '0');
                            dateStr = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
                        } else {
                            // 如果 config.js 里的日期不是标准的 ISO 字符串（例如直接写好了格式），则直接原样输出
                            dateStr = rawDate;
                        }
                    }
                }

                // 从 markdown 提取标题
                const lines = markdownText.split('\n');
                const firstLine = lines[0];
                let title = currentPost;
                let bodyMarkdown = markdownText;

                if (firstLine.startsWith('# ')) {
                    title = firstLine.replace('# ', '').trim();
                    // 去掉第一行（因为我们要重新自定义带时间的 H1 标题）
                    bodyMarkdown = lines.slice(1).join('\n');
                }

                document.title = title + ' - ' + BLOG_CONFIG.title;

                // 组装带“最后推送时间”的标题 HTML
                let headerHtml = `<h1 class="text-3xl font-bold text-gray-900 mb-2">${escapeHtml(title)}</h1>`;
                if (dateStr) {
                    headerHtml += `<div class="text-sm text-gray-400 mb-6 pb-4 border-b border-gray-200">最后推送时间：${dateStr}</div>`;
                } else {
                    headerHtml += `<div class="mb-6 pb-4 border-b border-gray-200"></div>`;
                }

                // 渲染最终页面
                contentDiv.innerHTML = headerHtml + marked.parse(bodyMarkdown);
            })
            .catch(err => {
                show404();
            });
        } else {
            // 【首页】：动态获取文章列表
            renderHomePage();
        }

        async function renderHomePage() {
            contentDiv.innerHTML = `<h2 class="text-2xl font-bold text-gray-900 mb-6">📝 近期文章</h2><p class="text-gray-500">正在同步文章列表...</p>`;

            try {
                // 优先使用 GitHub API 动态获取文章列表
                const apiUrl = `https://api.github.com/repos/${BLOG_CONFIG.owner}/${BLOG_CONFIG.repo}/contents/posts?ref=${BLOG_CONFIG.branch}`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`API 状态码 ${response.status}`);

                const files = await response.json();
                // 只保留 .md 文件，并过滤掉空文件
                const posts = Array.isArray(files) ? files.filter(f => f.type === 'file' && f.name.endsWith('.md')) : [];

                if (posts.length === 0) {
                    contentDiv.innerHTML = `<h2 class="text-2xl font-bold text-gray-900 mb-6">📝 近期文章</h2><p class="text-gray-500">主人很懒，还没有写任何文章~</p>`;
                    return;
                }

                // 用 Promise.all 批量获取每个文件的内容（提取标题）和最后提交时间
                allArticles = await Promise.all(
                    posts.map(async (file) => {
                        const [contentRes, commitRes] = await Promise.all([
                            fetch(file.download_url),
                            fetch(`https://api.github.com/repos/${BLOG_CONFIG.owner}/${BLOG_CONFIG.repo}/commits?path=posts/${encodeURIComponent(file.name)}&per_page=1`),
                        ]);
                        const text = await contentRes.text();
                        // 从首行 # 提取标题
                        const firstLine = text.split('\n')[0];
                        const title = firstLine.startsWith('# ') ? firstLine.replace('# ', '').trim() : file.name.replace('.md', '');

                        // 从最后一次 commit 中提取修改时间（精确到秒，转为本地时区）
                        let date = '';
                        if (commitRes.ok) {
                            const commits = await commitRes.json();
                            if (commits.length > 0) {
                                const dateStr = commits[0].commit.committer.date;
                                if (dateStr) {
                                    const d = new Date(dateStr);
                                    const pad = n => String(n).padStart(2, '0');
                                    date = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
                                }
                            }
                        }

                        return {
                            file: file.name,
                            title: title,
                            date: date,
                        };
                    })
                );

                processAndRenderList();

            } catch (err) {
                // API 失败或限流 → 兜底使用 config.js
                console.warn('GitHub API 请求失败，使用本地 config.js 兜底:', err.message);
                allArticles = BLOG_CONFIG.articles || [];
                processAndRenderList();
            }
        }

        // 统一处理排序与分页流
        function processAndRenderList() {
            // 1. 执行排序
            const sorted = [...allArticles];
            if (currentSortOrder === 'date-desc') {
                // 时间从新到旧 (无日期的排在最后面)
                sorted.sort((a, b) => {
                    if (!a.date) return 1;
                    if (!b.date) return -1;
                    return b.date.localeCompare(a.date);
                });
            } else if (currentSortOrder === 'date-asc') {
                // 时间从旧到新 (无日期的排在最后面)
                sorted.sort((a, b) => {
                    if (!a.date) return 1;
                    if (!b.date) return -1;
                    return a.date.localeCompare(b.date);
                });
            } else if (currentSortOrder === 'file-desc') {
                // 按文件名倒序排列
                sorted.sort((a, b) => b.file.localeCompare(a.file));
            }

            // 2. 执行分页切片
            const totalItems = sorted.length;
            const totalPages = Math.ceil(totalItems / pageSize) || 1;
            
            // 安全边界检查：防止修改单页条数时导致当前页超出范围
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = startIndex + pageSize;
            const paginatedArticles = sorted.slice(startIndex, endIndex);

            // 3. 渲染
            renderArticleList(paginatedArticles, totalItems, totalPages);
        }

        // 改变每页显示条数
        window.changePageSize = function(value) {
            pageSize = parseInt(value, 10) || 20;
            currentPage = 1; // 切换条数后重置回第一页
            processAndRenderList();
        }

        // 改变排序规则
        window.changeSortOrder = function(value) {
            currentSortOrder = value;
            currentPage = 1; // 改变排序后重置回第一页
            processAndRenderList();
        }

        // 翻页跳转
        window.goToPage = function(page) {
            currentPage = page;
            processAndRenderList();
            // 翻页后平滑滚动回顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 404 页面
        function show404() {
            document.title = '404 - ' + BLOG_CONFIG.title;
            contentDiv.innerHTML = `
                <div class="text-center py-12">
                    <h2 class="text-2xl font-bold text-gray-700 mb-2">404 — 文章未找到</h2>
                    <p class="text-gray-500 mt-2">URL 中的文章路径无效，或该文章已被移除。</p>
                    <a href="index.html" class="inline-block mt-4 text-blue-600 hover:underline font-medium">← 返回首页</a>
                </div>
            `;
        }

        function renderArticleList(articles, totalItems, totalPages) {
            // 工具栏：包含总条数提示、排序切换、每页数量自定义
            let listHtml = `
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between pb-4 mb-6 border-b border-gray-200 gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900 m-0">📝 近期文章</h2>
                        <p class="text-xs text-gray-400 mt-1 m-0">共收录 ${totalItems} 篇文章</p>
                    </div>
                    <div class="flex flex-wrap items-center gap-2 text-sm">
                        <!-- 排序选择 -->
                        <div class="flex items-center gap-1">
                            <span class="text-gray-500 whitespace-nowrap">排序:</span>
                            <select onchange="changeSortOrder(this.value)" class="bg-white border border-gray-300 rounded px-2 py-1 text-gray-700 focus:outline-none focus:border-blue-500">
                                <option value="date-desc" ${currentSortOrder === 'date-desc' ? 'selected' : ''}>发布时间 (最新)</option>
                                <option value="date-asc" ${currentSortOrder === 'date-asc' ? 'selected' : ''}>发布时间 (最早)</option>
                                <option value="file-desc" ${currentSortOrder === 'file-desc' ? 'selected' : ''}>文件名倒序</option>
                            </select>
                        </div>
                        <!-- 每页条数选择 -->
                        <div class="flex items-center gap-1 ml-2">
                            <span class="text-gray-500 whitespace-nowrap">每页:</span>
                            <select onchange="changePageSize(this.value)" class="bg-white border border-gray-300 rounded px-2 py-1 text-gray-700 focus:outline-none focus:border-blue-500">
                                <option value="10" ${pageSize === 10 ? 'selected' : ''}>10篇</option>
                                <option value="20" ${pageSize === 20 ? 'selected' : ''}>20篇</option>
                                <option value="50" ${pageSize === 50 ? 'selected' : ''}>50篇</option>
                                <option value="100" ${pageSize === 100 ? 'selected' : ''}>100篇</option>
                            </select>
                        </div>
                    </div>
                </div>
            `;

            if (!articles || articles.length === 0) {
                listHtml += `<p class="text-gray-500 py-6 text-center">空空如也，还没有任何文章~</p>`;
            } else {
                listHtml += `<ul class="space-y-4">`;
                articles.forEach(article => {
                    const title = article.title || article.file.replace('.md', '');
                    const file = article.file;
                    listHtml += `
                        <li class="border-b border-gray-100 pb-3">
                            <div class="flex justify-between items-center gap-4">
                                <a href="?post=${file}" class="text-lg font-medium text-blue-600 hover:text-blue-800 hover:underline transition">
                                    ${escapeHtml(title)}
                                </a>
                                ${article.date ? `<span class="text-sm text-gray-400 whitespace-nowrap">${article.date}</span>` : ''}
                            </div>
                            ${article.summary ? `<p class="text-sm text-gray-500 mt-1">${escapeHtml(article.summary)}</p>` : ''}
                        </li>
                    `;
                });
                listHtml += `</ul>`;

                // 翻页组件
                if (totalPages > 1) {
                    listHtml += `
                        <div class="flex items-center justify-center gap-2 mt-8 pt-4 border-t border-gray-100">
                            <!-- 上一页 -->
                            <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} 
                                class="px-3 py-1.5 rounded border text-sm font-medium transition cursor-pointer disabled:cursor-not-allowed disabled:opacity-40
                                ${currentPage === 1 ? 'border-gray-200 text-gray-300 bg-gray-50' : 'border-gray-300 text-gray-600 bg-white hover:bg-gray-50 hover:text-blue-600'}">
                                ‹ 上一页
                            </button>
                            
                            <!-- 页码指示 -->
                            <span class="text-sm text-gray-500 px-2">
                                第 <strong class="text-gray-900">${currentPage}</strong> / ${totalPages} 页
                            </span>

                            <!-- 下一页 -->
                            <button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} 
                                class="px-3 py-1.5 rounded border text-sm font-medium transition cursor-pointer disabled:cursor-not-allowed disabled:opacity-40
                                ${currentPage === totalPages ? 'border-gray-200 text-gray-300 bg-gray-50' : 'border-gray-300 text-gray-600 bg-white hover:bg-gray-50 hover:text-blue-600'}">
                                下一页 ›
                            </button>
                        </div>
                    `;
                }
            }
            contentDiv.innerHTML = listHtml;
        }

        // HTML 转义
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }
    </script>
</body>
</html>
